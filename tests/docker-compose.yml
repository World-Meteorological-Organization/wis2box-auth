services:
  wis2box-auth:
    container_name: wis2box-auth-test
    build: ../
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/status"]
      interval: 3s
      timeout: 3s
      retries: 100
    environment:
      - WIS2BOX_LOGGING_LOGLEVEL=INFO
    volumes:
      - auth-test-data:/data/wis2box:rw
    ports:
      - "5000:80"

volumes:
  auth-test-data: